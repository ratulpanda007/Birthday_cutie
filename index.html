<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Surprise ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:#fff0f5;
}

/* =========================
   FIRST SCREEN
========================= */

#countdownPage{
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:linear-gradient(
        135deg,
        #ffd6e5,
        #fff0f5,
        #ffe4ec
    );

    position:absolute;
    z-index:10;
    transition:1s;
}

#countdownPage h1{
    color:#e75480;
    font-size:45px;
    margin-bottom:20px;
    text-align:center;
}

#countdown{
    font-size:90px;
    font-weight:bold;
    color:#ff3366;
    animation:pulse .7s infinite alternate;
}

@keyframes pulse{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.15);
    }
}

/* =========================
   PHOTO PAGE
========================= */

#photoPage{
    position:absolute;
    width:100vw;
    height:100vh;

    background:
    linear-gradient(
        135deg,
        #fff5f7,
        #ffe6ee
    );

    overflow:hidden;
    opacity:0;
    transition:1s;
}

/* Polaroid */

.polaroid{
    position:absolute;
    width:150px;
    padding:8px 8px 25px;

    background:white;

    box-shadow:
    0 8px 20px rgba(0,0,0,.25);

    border-radius:3px;

    opacity:0;

    animation:photoAppear 1.2s forwards;
}

.polaroid img{
    width:100%;
    height:160px;
    object-fit:cover;
}

@keyframes photoAppear{

    0%{
        opacity:0;
        transform:
        translateY(-150px)
        scale(.3)
        rotate(0deg);
    }

    100%{
        opacity:1;
    }
}

/* individual photo position */

.p1{
    left:5%;
    top:8%;
    transform:rotate(-12deg);
    animation-delay:.2s;
}

.p2{
    left:30%;
    top:3%;
    transform:rotate(8deg);
    animation-delay:.5s;
}

.p3{
    right:7%;
    top:7%;
    transform:rotate(-7deg);
    animation-delay:.8s;
}

.p4{
    left:10%;
    bottom:5%;
    transform:rotate(8deg);
    animation-delay:1.1s;
}

.p5{
    left:42%;
    bottom:3%;
    transform:rotate(-9deg);
    animation-delay:1.4s;
}

.p6{
    right:8%;
    bottom:5%;
    transform:rotate(12deg);
    animation-delay:1.7s;
}

/* =========================
   CENTER TEXT
========================= */

#message{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    text-align:center;

    z-index:5;

    opacity:0;

    animation:messageShow 1.5s forwards;
    animation-delay:3s;
}

#message h1{
    font-family:cursive;
    color:#e91e63;
    font-size:55px;

    text-shadow:
    2px 2px 5px rgba(0,0,0,.15);
}

#message p{
    margin-top:15px;
    color:#555;
    font-size:20px;
}

@keyframes messageShow{

    from{
        opacity:0;
        transform:
        translate(-50%,-50%)
        scale(.5);
    }

    to{
        opacity:1;
        transform:
        translate(-50%,-50%)
        scale(1);
    }
}

/* =========================
   HEART ANIMATION
========================= */

.heart{
    position:absolute;
    bottom:-50px;

    font-size:25px;

    animation:
    floatingHeart 6s linear forwards;

    pointer-events:none;
}

@keyframes floatingHeart{

    0%{
        transform:translateY(0) rotate(0deg);
        opacity:1;
    }

    100%{
        transform:
        translateY(-110vh)
        rotate(360deg);

        opacity:0;
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    #countdownPage h1{
        font-size:28px;
    }

    #countdown{
        font-size:70px;
    }

    .polaroid{
        width:105px;
        padding:5px 5px 18px;
    }

    .polaroid img{
        height:115px;
    }

    #message h1{
        font-size:34px;
    }

    #message p{
        font-size:16px;
    }

    .p1{
        left:2%;
        top:5%;
    }

    .p2{
        left:36%;
        top:2%;
    }

    .p3{
        right:2%;
        top:12%;
    }

    .p4{
        left:3%;
        bottom:7%;
    }

    .p5{
        left:37%;
        bottom:2%;
    }

    .p6{
        right:2%;
        bottom:10%;
    }
}

</style>
</head>

<body>


<!-- =====================
     COUNTDOWN
===================== -->

<div id="countdownPage">

    <h1>Something Special For You ❤️</h1>

    <div id="countdown">3</div>

</div>


<!-- =====================
     PHOTOS
===================== -->

<div id="photoPage">


    <div class="polaroid p1">
        <img src="photo1.jpg">
    </div>


    <div class="polaroid p2">
        <img src="photo2.jpg">
    </div>


    <div class="polaroid p3">
        <img src="photo3.jpg">
    </div>


    <div class="polaroid p4">
        <img src="photo4.jpg">
    </div>


    <div class="polaroid p5">
        <img src="photo5.jpg">
    </div>


    <div class="polaroid p6">
        <img src="photo6.jpg">
    </div>



    <!-- MESSAGE -->

    <div id="message">

        <h1>
            ❤️ Happy Birthday ❤️
        </h1>

        <p>
            You make every moment more beautiful.
            <br>
            I hope your day is as special as you are. 💕
        </p>

    </div>

</div>


<script>

/* =========================
   COUNTDOWN
========================= */

let number = 3;

const countdown =
document.getElementById("countdown");

const countdownPage =
document.getElementById("countdownPage");

const photoPage =
document.getElementById("photoPage");


let timer = setInterval(function(){

    number--;

    if(number > 0){

        countdown.innerHTML = number;

    }

    else{

        clearInterval(timer);

        countdown.innerHTML = "❤️";


        setTimeout(function(){

            countdownPage.style.opacity = "0";


            setTimeout(function(){

                countdownPage.style.display = "none";

                photoPage.style.opacity = "1";

                startHearts();

            },800);


        },600);

    }

},1000);


/* =========================
   FLOATING HEARTS
========================= */

function createHeart(){

    const heart =
    document.createElement("div");

    heart.className = "heart";

    const hearts =
    ["❤️","💕","💗","💖","💘","🌸"];

    heart.innerHTML =
    hearts[
        Math.floor(
            Math.random()*hearts.length
        )
    ];


    heart.style.left =
    Math.random()*100 + "vw";


    heart.style.fontSize =
    (15 + Math.random()*25) + "px";


    heart.style.animationDuration =
    (4 + Math.random()*4) + "s";


    document.body.appendChild(heart);


    setTimeout(function(){

        heart.remove();

    },8000);

}


function startHearts(){

    setInterval(
        createHeart,
        350
    );

}

</script>

</body>
</html>
